name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备代号'
        required: true
        default: 'lmi'
        type: choice
        options:
          - psyche
          - umi
          - munch
          - thyme
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      include_ksu:
        description: '是否包含KSU'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    # 生成短哈希（修复 substr() 报错）
    - name: Set short commit SHA
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-${{ github.event.inputs.device }}-${{ github.event.inputs.include_ksu }}-${{ env.SHORT_SHA }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.event.inputs.device }}-${{ github.event.inputs.include_ksu }}-
          ${{ runner.os }}-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-ccache-

    - name: Setup zyc-clang toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz
        cd $GITHUB_WORKSPACE


    - name: Build kernel
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        if [ "${{ github.event.inputs.include_ksu }}" = "true" ]; then
          bash build.sh ${{ github.event.inputs.device }} ksu
        else
          bash build.sh ${{ github.event.inputs.device }}
        fi

    - name: Show ccache stats
      run: ccache -s

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.device }}${{ github.event.inputs.include_ksu == 'true' && '-ksu' || '' }}-kernel
        path: |
          *.zip
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb

    - name: Get Date and SHA
      id: date_vars
      run: |
        echo "date=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "display_date=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y')" >> $GITHUB_OUTPUT
        echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Download Manager APKs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download Manager -p '*.apk' || echo "No manager APKs found"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Kernel
        name: "Kernel 4.19"
        draft: false
        prerelease: false
        files: |
          *.zip
          *.apk

    - name: Upload to Telegram
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        CHANNEL_TG_RELEASE_ID: ${{ secrets.CHANNEL_TG_RELEASE_ID }}
      run: |
        if [ -z "$TG_TOKEN" ] || [ -z "$CHANNEL_TG_RELEASE_ID" ]; then
          echo "Telegram credentials not provided. Skipping upload."
          exit 0
        fi
        
        shopt -s nullglob
        files=( *.zip )
        if [ ${#files[@]} -eq 0 ]; then
          echo "No zip files to upload."
          exit 0
        fi
        
        CAPTION="🔥 <b>New kernel build available!</b>"
        CAPTION_JSON=$(echo "$CAPTION" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        
        for (( i=0; i<${#files[@]}; i+=10 )); do
          chunk=("${files[@]:i:10}")
          media_json="["
          cmd=(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMediaGroup" -F chat_id="${CHANNEL_TG_RELEASE_ID}")
          
          for j in "${!chunk[@]}"; do
            file="${chunk[$j]}"
            if [ $j -eq 0 ]; then
              media_json+="{\"type\":\"document\", \"media\":\"attach://file${j}\", \"caption\":\"${CAPTION_JSON}\", \"parse_mode\":\"HTML\"}"
            else
              media_json+=", {\"type\":\"document\", \"media\":\"attach://file${j}\"}"
            fi
            cmd+=(-F "file${j}=@${file}")
          done
          media_json+="]"
          cmd+=(-F "media=${media_json}")
          
          echo "Uploading chunk starting with ${chunk[0]}..."
          "${cmd[@]}"
          sleep 2
        done
