name: Build All Devices Kernel (Matrix Parallel)

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: 'Build variant (none, ksu, both)'
        required: true
        default: 'both'
        type: choice
        options:
          - none
          - ksu
          - both

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [thyme, psyche, umi, munch, lmi, cmi, cas, apollo, alioth, elish, enuma, dagu, pipa]

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    - name: Setup zyc-clang toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz
        cd $GITHUB_WORKSPACE

    - name: Build kernel for ${{ matrix.device }} (No KSU)
      if: ${{ github.event.inputs.ksu_option == 'none' || github.event.inputs.ksu_option == 'both' }}
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        bash build.sh ${{ matrix.device }}

    - name: Build kernel for ${{ matrix.device }} (With KSU)
      if: ${{ github.event.inputs.ksu_option == 'ksu' || github.event.inputs.ksu_option == 'both' }}
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        bash build.sh ${{ matrix.device }} ksu

    - name: Upload zips for ${{ matrix.device }}
      uses: actions/upload-artifact@v4
      with:
        name: zips-${{ matrix.device }}
        path: |
          Kernel_MIUI_${{ matrix.device }}*.zip
          Kernel_AOSP_${{ matrix.device }}*.zip
          *.apk
          KernelSU/*.apk

  release:
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release_zips

    - name: Get date and short SHA
      id: vars
      run: |
        echo "date=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "display_date=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y')" >> $GITHUB_OUTPUT
        echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Download Manager APKs and Bundle per Device
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Tải file APK từ bản release Manager
        mkdir -p manager_apks
        gh release download Manager -p '*.apk' -D ./manager_apks || echo "No manager APKs found or release missing."
        
        # Đóng gói zip cho từng thiết bị
        for dir in ./release_zips/zips-*; do
          if [ -d "$dir" ]; then
            device=$(basename "$dir" | sed 's/zips-//')
            bundle_name="${device}-${{ steps.vars.outputs.sha }}-${{ steps.vars.outputs.date }}.zip"
            
            mkdir -p bundle_tmp
            cp ./manager_apks/*.apk bundle_tmp/ 2>/dev/null || true
            cp "$dir"/*.zip bundle_tmp/ 2>/dev/null || true
            
            cd bundle_tmp
            zip -r9 "../${bundle_name}" .
            cd ..
            
            rm -rf bundle_tmp
          fi
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Kernel
        name: "Kernel 4.19"
        body: "Automated kernel build for commit ${{ github.sha }}"
        files: |
          ./*.zip
