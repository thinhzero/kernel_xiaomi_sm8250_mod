name: Build All Devices Kernel (Matrix Parallel)

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: 'Build variant (none, ksu, both)'
        required: true
        default: 'both'
        type: choice
        options:
          - none
          - ksu
          - both

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [thyme, psyche, umi, munch, lmi, cmi, cas, apollo, alioth, elish, enuma, dagu, pipa]
        os_target: [miui, aosp]
        ksu_target: [ksu, nksu]

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    - name: Setup zyc-clang toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz
        cd $GITHUB_WORKSPACE

    - name: Build kernel for ${{ matrix.device }} (${{ matrix.ksu_target }})
      if: ${{ github.event.inputs.ksu_option == 'both' || (github.event.inputs.ksu_option == 'ksu' && matrix.ksu_target == 'ksu') || (github.event.inputs.ksu_option == 'none' && matrix.ksu_target == 'nksu') }}
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        bash build.sh ${{ matrix.device }} ${{ matrix.ksu_target }} ${{ matrix.os_target }}

    - name: Upload zips for ${{ matrix.device }}
      uses: actions/upload-artifact@v4
      with:
        name: zips-${{ matrix.device }}-${{ matrix.os_target }}-${{ matrix.ksu_target }}
        path: |
          Kernel_MIUI_${{ matrix.device }}*.zip
          Kernel_AOSP_${{ matrix.device }}*.zip
          *.apk
          KernelSU/*.apk

  release:
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release_zips

    - name: Get date and short SHA
      id: vars
      run: |
        echo "date=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "display_date=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y')" >> $GITHUB_OUTPUT
        echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Download Manager APKs and Bundle per Device
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Tải file APK từ bản release Manager
        mkdir -p manager_apks
        gh release download Manager -p '*.apk' -D ./manager_apks || echo "No manager APKs found or release missing."
        
        # Đóng gói zip cho từng thiết bị
        DEVICES=(thyme psyche umi munch lmi cmi cas apollo alioth elish enuma dagu pipa)
        for device in "${DEVICES[@]}"; do
          bundle_name="${device}-${{ steps.vars.outputs.sha }}-${{ steps.vars.outputs.date }}.zip"
          has_content=0
          mkdir -p bundle_tmp
          
          cp ./manager_apks/*.apk bundle_tmp/ 2>/dev/null || true
          
          for d in ./release_zips/zips-${device}-*; do
            if [ -d "$d" ]; then
              cp "$d"/*.zip bundle_tmp/ 2>/dev/null && has_content=1 || true
            fi
          done
          
          if [ "$has_content" -eq 1 ]; then
            cd bundle_tmp
            zip -r9 "../${bundle_name}" .
            cd ..
          fi
          rm -rf bundle_tmp
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Kernel
        name: "Kernel 4.19"
        body: "Automated kernel build for commit ${{ github.sha }}"
        files: |
          ./*.zip

    - name: Upload to Telegram
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        CHANNEL_TG_RELEASE_ID: ${{ secrets.CHANNEL_TG_RELEASE_ID }}
      run: |
        if [ -z "$TG_TOKEN" ] || [ -z "$CHANNEL_TG_RELEASE_ID" ]; then
          echo "Telegram credentials not provided. Skipping upload."
          exit 0
        fi
        
        shopt -s nullglob
        files=( ./*.zip )
        if [ ${#files[@]} -eq 0 ]; then
          echo "No zip files to upload."
          exit 0
        fi
        
        CAPTION="🔥 <b>New super-zip kernel bundles available!</b>"
        CAPTION_JSON=$(echo "$CAPTION" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        
        for (( i=0; i<${#files[@]}; i+=10 )); do
          chunk=("${files[@]:i:10}")
          media_json="["
          cmd=(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMediaGroup" -F chat_id="${CHANNEL_TG_RELEASE_ID}")
          
          for j in "${!chunk[@]}"; do
            file="${chunk[$j]}"
            if [ $j -eq 0 ]; then
              media_json+="{\"type\":\"document\", \"media\":\"attach://file${j}\", \"caption\":\"${CAPTION_JSON}\", \"parse_mode\":\"HTML\"}"
            else
              media_json+=", {\"type\":\"document\", \"media\":\"attach://file${j}\"}"
            fi
            cmd+=(-F "file${j}=@${file}")
          done
          media_json+="]"
          cmd+=(-F "media=${media_json}")
          
          echo "Uploading chunk starting with ${chunk[0]}..."
          "${cmd[@]}"
          sleep 2
        done
